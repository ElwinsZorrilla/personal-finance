server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy ya pone las suyas; estas son las que dependen de lo que se sirve.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # La PWA no carga nada de fuera: ni fuentes, ni analítica, ni imágenes. Se
    # dice explícitamente para que un script inyectado no pueda mandar datos a
    # ningún sitio. `connect-src` incluye 'self' porque el API se sirve por el
    # mismo dominio a través del proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # El wasm se sirve con su tipo. Sin esto el navegador rechaza compilarlo en
    # streaming y la app tarda bastante más en arrancar la primera vez.
    types {
        application/wasm wasm;
    }

    # Los archivos con hash en el nombre no cambian nunca: se cachean un año.
    location ~* \.(js|wasm|otf|ttf|png|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index y el service worker **no se cachean**. Son los que dicen que hay
    # una versión nueva; si se cachean, el navegador sigue con la vieja hasta
    # que caduque, y una app financiera desplegada con un arreglo no puede
    # esperar a que expire una caché.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Una PWA es una sola página: cualquier ruta devuelve el index y el
    # enrutador de Flutter decide. Sin esto, recargar dentro de la app da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
