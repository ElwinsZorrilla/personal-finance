server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Cabeceras de seguridad ----
    #
    # Se repiten en cada `location` que ponga cabeceras propias, y no es
    # redundancia: en nginx, un `add_header` dentro de un bloque **descarta
    # todos los heredados del padre**. Con las de abajo solo en `server`, las
    # dos rutas que fijan su `Cache-Control` se quedaban sin CSP, sin `nosniff`
    # y sin `Referrer-Policy`.
    #
    # Se vio al probar desde fuera: la respuesta del `index.html` traía
    # `cache-control` y nada más. Un `nginx -t` correcto no dice nada de esto.

    # La PWA no carga nada de fuera: ni fuentes, ni analítica, ni imágenes. Se
    # dice explícitamente para que un script inyectado no tenga a dónde mandar
    # datos.
    #
    # `connect-src` nombra al API porque vive en otro subdominio, y para el
    # navegador eso es otro origen. Sin esta línea la app cargaría bien y todas
    # sus peticiones fallarían: el error aparece en la consola del navegador y
    # no en ningún registro del servidor, que es la forma más cara de
    # diagnosticarlo.
    #
    # `__API_ORIGIN__` lo sustituye el Dockerfile al construir.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # NO se declara ningún bloque `types` aquí.
    #
    # En nginx, un bloque `types` **sustituye la tabla entera** de tipos MIME en
    # vez de añadirse a ella. Había uno con `application/wasm` y el efecto fue
    # que el único tipo conocido pasó a ser ese: `index.html` y `main.dart.js`
    # se servían como `application/octet-stream`, y Safari **descargaba** la
    # página en vez de abrirla, como un archivo llamado «data».
    #
    # Y sobraba, además de romper: el `mime.types` que trae nginx 1.27 ya
    # incluye `application/wasm`.
    #
    # `nginx -t` no dice nada de esto y el contenedor arranca sano. Lo único que
    # lo detecta es pedir la página y mirar el `Content-Type`.

    # ---- Caché ----
    #
    # El reparto es el de siempre en una app web, pero **costó dos despliegues
    # rotos llegar a él**, así que queda escrito por qué.
    #
    # Primero se cacheó un año como inmutable todo lo que fuera `.js`, `.wasm` o
    # `.json`, con el argumento de que «los archivos con hash en el nombre no
    # cambian nunca». Flutter Web **no pone hash en los nombres**: se llaman
    # siempre `main.dart.js` y `flutter_bootstrap.js`. Seis despliegues seguidos
    # sin que cambiara nada en la pantalla.
    #
    # Después se puso `no-cache` en todo, que es correcto y **no bastó**:
    # Cloudflare lo reescribe a `max-age=14400` camino del navegador. Las
    # cabeceras del origen son una petición, no una orden; con una CDN en medio
    # gana su política, y no hay nada que nginx pueda decir para impedirlo.
    #
    # Lo que ninguna caché puede negociar es **una URL distinta**. El Dockerfile
    # le añade `?v=<versión>` a `flutter_bootstrap.js`, `main.dart.js` y
    # `arranque.js` al construir la imagen, así que cada despliegue los pide por
    # una dirección que nadie ha visto antes. Eso los vuelve inmutables de
    # verdad, y aquí se declaran como tales.
    #
    # `index.html` es la excepción y el eje: es el único cuya dirección no
    # cambia, porque es el que lleva dentro las de los demás. Si llegara viejo,
    # traería las versiones viejas y todo lo anterior no serviría de nada.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/margen-seguridad.inc;
    }

    location ~ ^/(main\.dart\.js|flutter_bootstrap\.js|arranque\.js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/margen-seguridad.inc;
    }

    # El resto —el motor gráfico, las fuentes, los iconos— lo pide el motor de
    # Flutter en tiempo de ejecución y no sale del `index.html`, así que no
    # lleva versión en la URL. Se revalida.
    #
    # Cloudflare convertirá esto en cuatro horas de caché de navegador, y aquí
    # sí se puede vivir con ello: son archivos que solo cambian al subir de
    # versión el SDK de Flutter. Queda anotado como deuda, no como acierto.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/margen-seguridad.inc;
        try_files $uri $uri/ /index.html;
    }

    # Una PWA es una sola página: cualquier ruta devuelve el index y el
    # enrutador de Flutter decide. Sin esto, recargar dentro de la app da 404.
    #
    # El `no-cache` de ese bloque **no llega al `index.html`**: cuando
    # `try_files` cae en su último parámetro hace una redirección interna, y una
    # redirección interna vuelve a elegir `location`. Así que `/panel` acaba en
    # `location = /index.html` y sale con `no-store`, que es lo que hace falta.
    #
    # Está escrito porque yo había supuesto lo contrario y puse un bloque de más
    # para cubrirlo. Lo que lo resolvió fue pedirle las cabeceras a la imagen:
    #
    #   /panel           200   no-store
    #   /nada-que-existe 200   no-store
    #   /canvaskit/…     200   no-cache
}
