# Stack para desplegar en Portainer.
#
# Supuestos del servidor actual:
#   * Nginx Proxy Manager ya corre y ya publica 80/443.
#   * Existe una red externa a la que NPM está conectado.
#   * Postgres puede ser el que ya tienes o el de este stack.
#
# Ningún servicio publica puertos al host. El único camino de entrada es
# NPM → red del proxy → api:8080. La base de datos vive en una red interna
# sin salida y no es alcanzable desde fuera del stack.

name: margen

services:
  # Docker crea los volúmenes con dueño root. Un contenedor que corre como
  # 1001 no puede escribir en ellos y entra en ciclo de reinicio con un error
  # de permisos que no menciona permisos. Este servicio corrige el dueño una
  # vez y termina.
  init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1001:1001 /keys && chmod 700 /keys"]
    volumes:
      - dataprotection:/keys
    restart: "no"

  # El nombre del servicio es `margen-api` y no `api` a propósito.
  #
  # Compose registra el nombre del servicio como alias de DNS en **cada** red a
  # la que se conecta, incluida la compartida del proxy. En esa red ya vive otro
  # contenedor con el alias `api`, y dos con el mismo alias hacen que el DNS de
  # Docker reparta entre los dos: el proxy mandaría parte del tráfico de ese otro
  # sistema a este, de forma intermitente y sin que nada falle a la vista.
  margen-api:
    container_name: margen-api
    image: ${REGISTRY}/margen-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      # En una sola línea: un escalar plegado de YAML introduce espacios donde
      # había saltos y deja la cadena a merced de cómo los tolere el driver.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Disable;Include Error Detail=false"
      DataProtection__KeyRing: /keys
      # Sin este valor el alta de dispositivos responde 503 y no registra nada.
      # Es a propósito: un servidor recién desplegado no puede quedar aceptando
      # el teléfono de quien pase por ahí.
      Auth__EnrollmentCode: ${AUTH_ENROLLMENT_CODE}
      # De dónde se acepta que llamen. Es la PWA y nada más: este API se
      # autentica con un token en una cabecera, y abrirlo a cualquier origen
      # dejaría que una página cualquiera hiciera peticiones con el token de
      # quien la visite. Vacío = no se permite ninguno.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      TZ: America/Santo_Domingo
    volumes:
      - dataprotection:/keys
    networks:
      - proxy
      - internal
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # La PWA: archivos estáticos servidos por nginx. Va en la red del proxy y no
  # en la interna, porque es lo que abre el navegador; y no toca la base de
  # datos, porque no tiene nada que buscar ahí.
  # Mismo motivo que `margen-api`: nada genérico en la red compartida.
  margen-app:
    container_name: margen-app
    image: ${REGISTRY}/margen-app:${TAG:-latest}
    restart: unless-stopped
    networks:
      - proxy
    read_only: true
    tmpfs:
      # nginx escribe su pid y sus temporales. Con el sistema de archivos de
      # solo lectura hacen falta en memoria.
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # `127.0.0.1` y no `localhost`. Dentro del contenedor, `localhost`
      # resuelve primero a `::1`, y nginx escucha en IPv4: la comprobación daba
      # «connection refused» y el contenedor figuraba como enfermo mientras
      # servía la app perfectamente. Se vio pidiéndoselo a las dos direcciones.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: ${REGISTRY}/margen-worker:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Disable;Include Error Detail=false"
      Imap__Host: ${IMAP_HOST}
      Imap__Port: ${IMAP_PORT:-993}
      Imap__User: ${IMAP_USER}
      Imap__Password: ${IMAP_PASSWORD}
      Imap__AllowedSenders: ${IMAP_ALLOWED_SENDERS}
      Muestras__DatosPersonales: ${MUESTRAS_DATOS_PERSONALES:-}
      TZ: America/Santo_Domingo
    networks:
      - internal
      # El worker es el único que necesita **salir**: baja el correo del banco
      # por IMAP. Estando solo en `internal`, que es `internal: true`, no tenía
      # ni DNS ni ruta a internet y fallaba al conectar en cada vuelta.
      #
      # Es un fallo que solo existe desplegado: en local el worker corre con la
      # red de la máquina y sale sin pedir permiso.
      #
      # `egress` da salida por NAT y **ninguna entrada**: no publica puertos y
      # nadie de fuera puede iniciar una conexión hacia él.
      - egress
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: America/Santo_Domingo
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Santo_Domingo
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      # La verificación y la restauración van montadas aparte y a propósito: la
      # primera crea una base descartable y no puede hacer daño; la segunda
      # destruye la de producción y se ejecuta a mano. Fundirlas en un guion con
      # una bandera es como se acaba escribiendo la bandera equivocada a las
      # tres de la mañana.
      - ./verificar-restauracion.sh:/usr/local/bin/verificar-restauracion.sh:ro
      - ./restaurar.sh:/usr/local/bin/restaurar.sh:ro
      - ${BACKUP_PATH:-./backups}:/backups
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginxproxymanager_default}
  internal:
    internal: true

  # Salida a internet para el worker, y solo para el worker. La base, el API y
  # el respaldo siguen sin poder salir.
  egress:
    driver: bridge

volumes:
  pgdata:
  dataprotection:
