<!DOCTYPE html>
<html lang="es-DO">
<head>
  <!-- Lo reemplaza `flutter build web --base-href`. Se sirve desde la raíz. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Cuánto puedes gastar sin afectar tus compromisos.">

  <!--
    `viewport-fit=cover` es lo que deja que la app llegue hasta los bordes en un
    iPhone con muesca. Sin él queda una franja del color de fondo del navegador
    arriba y abajo, y la app instalada se ve como una página metida en un marco
    en vez de como una app.

    `user-scalable=no` no se pone a propósito: impedir el zoom en una pantalla
    llena de cifras es quitarle la lupa a quien la necesita para leerlas.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!--
    Instalada en la pantalla de inicio, iOS la abre sin la barra de Safari.
    `mobile-web-app-capable` es el nombre actual; el `apple-` es el histórico y
    sigue haciendo falta en versiones de iOS que no entienden el otro.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!--
    `black-translucent` deja que el contenido pase por debajo de la barra de
    estado, que es lo que permite que el fondo oscuro llegue arriba del todo.
    Con `black` queda una franja negra que no es del mismo negro.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Margen">

  <!-- El color de la barra del navegador antes de instalarla. Es `ink`. -->
  <meta name="theme-color" content="#0B1418">

  <!--
    En iOS el icono de la pantalla de inicio sale de aquí y no del manifiesto.
    Sin esta línea, iOS usa una captura de la página, que es ilegible.
  -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Margen</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      El fondo se pinta aquí y no solo en Flutter. Entre que el navegador abre
      la página y que arranca el motor gráfico pasan unos segundos la primera
      vez —dos megas de wasm—, y sin esto ese rato es una pantalla en blanco.
      En una app de fondo oscuro, el blanco deslumbra y parece que algo falló.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0B1418;
      color: #EDE7DC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      /* Sin rebote al llegar al final. En iOS, el rebote elástico deja ver el
         fondo del navegador por encima o por debajo del contenido, y ese
         vistazo es de las cosas que más delatan que algo es una página. */
      overscroll-behavior: none;

      /* Nada de seleccionar texto ni de lupa al mantener pulsado. En una app no
         se selecciona la interfaz: se selecciona el contenido de un campo, y de
         eso se encarga el propio campo. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;

      /* El destello gris del toque es de Safari, no del diseño. La respuesta al
         toque la da la app: los botones encogen. */
      -webkit-tap-highlight-color: transparent;

      /* Sin doble toque para acercar. El zoom por pellizco sigue disponible
         —hay cifras que alguien puede necesitar agrandar— pero el doble toque
         se dispara sin querer al pulsar rápido dos veces. */
      touch-action: manipulation;
    }

    #cargando {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      letter-spacing: 0.02em;
      color: #7E939B;
    }
  </style>
</head>
<body>
  <!--
    Lo quita `arranque.js` cuando Flutter pinta su primer fotograma. **No se
    quita solo**: la primera versión daba por hecho que Flutter pintaría encima,
    y con `position: fixed` cubriendo el viewport la app podía estar corriendo
    perfectamente debajo mientras lo único visible era «Cargando…».

    No lleva barra de progreso: una que no sabe cuánto falta miente, y aquí no
    se sabe.
  -->
  <div id="cargando">Cargando…</div>

  <!-- Antes del bootstrap, para no perderse los errores del arranque. -->
  <script src="arranque.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
